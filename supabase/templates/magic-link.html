<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your sign-in link</title>
  </head>
  <body style="margin:0;background:#1a1613;color:#f4f1e8;font-family:Georgia,serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1a1613;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="padding:8px 4px 20px;font-family:Arial,sans-serif;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#d2b07a;">
                Empire Mercenary Company
              </td>
            </tr>
            <tr>
              <td style="font-size:28px;line-height:1.2;color:#f4f1e8;">Your sign-in link</td>
            </tr>
            <tr>
              <td style="padding:16px 0 24px;font-size:17px;line-height:1.5;color:#f4f1e8;">

              </td>
            </tr>
            <tr>
              <td>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#b11217;color:#f4f1e8;text-decoration:none;font-family:Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:14px 22px;">
                  Your sign-in link
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:28px;font-size:14px;line-height:1.5;color:#c4bfb2;">
                If you did not ask for this, you can ignore the message.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

</html>
