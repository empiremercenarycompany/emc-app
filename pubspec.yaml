name: emc_app
description: Empire Mercenary Company — Digital Headquarters
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.2
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  equatable: ^2.0.5
  uuid: ^4.5.1
  collection: ^1.18.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    # TODO: Corleone is the brand heading face, but it is a commercial font
    # and is not included in this repo. Headings request the Corleone family
    # in AppTheme and fall back to the platform default until licensed
    # Corleone-Regular.ttf and Corleone-Bold.ttf are added here.
    # - family: Corleone
    #   fonts:
    #     - asset: assets/fonts/Corleone-Regular.ttf
    #     - asset: assets/fonts/Corleone-Bold.ttf
    #       weight: 700
    #
    # League Spartan (OFL) static instances generated from the upstream
    # variable font. License: assets/fonts/OFL.txt
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Regular.ttf
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700
